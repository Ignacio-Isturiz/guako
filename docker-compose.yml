name: guako

services:
  db:
    image: pgvector/pgvector:pg16
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Development only: remove this mapping in production
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    image: guako-api
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Wins over env_file: backend/.env keeps relative paths for running without Docker,
      # but inside the container only /data is writable by the app user.
      SESSIONS_AUDIO_DIR: /data/sessions
      TTS_CACHE_DIR: /data/tts-cache
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    image: guako-web
    depends_on:
      - api
    ports:
      # 5173 = the origin already allowed in CORS_ORIGINS
      - "5173:80"

volumes:
  pgdata:
  appdata:
