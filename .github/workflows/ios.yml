# Compila la app de iOS en un Mac de GitHub (no hace falta tener uno). Se lanza a mano:
# GitHub → Actions → "iOS" → Run workflow.
#
#   upload = false  → solo comprueba que compila (para simulador, sin firmar). No necesita nada.
#   upload = true   → archiva firmado y lo sube a App Store Connect / TestFlight. Necesita estos secretos
#                     (Settings → Secrets and variables → Actions):
#     APPLE_TEAM_ID              Team ID de developer.apple.com (Membership)
#     ASC_KEY_ID                 App Store Connect → Users and Access → Integrations → API key (rol App Manager)
#     ASC_ISSUER_ID              el Issuer ID de esa misma pantalla
#     ASC_KEY_P8                 el contenido completo del archivo .p8 descargado
#   La firma es automática (Xcode crea certificados y perfiles con la API key). La app debe existir antes en
#   App Store Connect con el bundle id com.guako.app. Subir la versión antes: npm run version:mobile.
#
# Ojo: en repos privados los minutos de macOS cuentan x10 del plan gratuito de Actions.
name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Firmar y subir a TestFlight'
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (modo mobile) y sincronizar Capacitor
        run: npm run build:mobile

      - name: Compilar para simulador (sin firmar)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Archivar y subir a App Store Connect
        if: ${{ inputs.upload }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive | tail -n 40

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          rm -f "$KEY_PATH"
