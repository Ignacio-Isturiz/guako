<!doctype html>
<!-- Gráfico destacado de Google Play (1024×500). Lo captura scripts/store-screenshots.mjs (?lang=es|en). -->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1024px; height: 500px; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px 0 64px;
        background-color: #0b2a6b;
        background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1.6px, transparent 1.7px);
        background-size: 18px 18px;
        color: #fff;
        font-family: 'Nunito', system-ui, sans-serif;
      }
      .logo {
        flex: none;
        width: 330px;
        height: 330px;
        border-radius: 64px;
        transform: rotate(-5deg);
        box-shadow: 12px 12px 0 #ffc700;
      }
      h1 {
        font-family: 'Baloo 2', 'Nunito', sans-serif;
        font-weight: 800;
        font-size: 64px;
        line-height: 0.98;
      }
      h1 span { color: #ffc700; }
      p {
        margin-top: 22px;
        font-size: 26px;
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.86);
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../src/shared/assets/brand/guako-logo.png" alt="" />
    <div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <script>
      const TEXT = {
        es: { title: 'Habla inglés<br><span>sin pena</span>', sub: 'Conversa por voz con Guako y recibe un informe de pronunciación y gramática.' },
        en: { title: 'Speak English<br><span>with confidence</span>', sub: 'Talk by voice with Guako and get feedback on your pronunciation and grammar.' },
      }
      const t = TEXT[new URLSearchParams(location.search).get('lang')] || TEXT.es
      document.getElementById('title').innerHTML = t.title
      document.getElementById('sub').textContent = t.sub
    </script>
  </body>
</html>
